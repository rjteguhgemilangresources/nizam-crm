<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Borang Servis — Nizam Servis & Repair</title>
<style>
  :root{
    --ink:#152623; --ink-soft:#4b615c; --bg:#F5F3EC; --panel:#FFFFFF; --line:#DCE0D6;
    --teal:#0E4F4A; --teal-deep:#0A3A37; --teal-tint:#E4EFEC;
    --ok:#2F7D4F; --ok-tint:#E3F2E6; --bad:#B4392E; --bad-tint:#F8E3E0;
    --radius:10px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:480px; margin:0 auto; padding:20px 16px 40px; }
  .logo-row{ text-align:center; margin-bottom:8px; }
  .logo-row img{ width:120px; height:120px; }
  h1{ font-family:Georgia,Cambria,serif; font-size:19px; color:var(--teal-deep); margin:4px 0 2px; text-align:center; }
  .sub{ color:var(--ink-soft); font-size:13px; margin-bottom:18px; text-align:center; }
  .card{ background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:14px; }
  label{ display:block; font-size:13px; color:var(--ink-soft); margin:14px 0 6px; }
  label:first-child{ margin-top:0; }
  input,textarea,select{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
    font-size:15px; font-family:inherit; background:var(--bg); color:var(--ink);
  }
  textarea{ resize:vertical; min-height:70px; }
  .phone-row{ display:flex; gap:8px; }
  .phone-row select{ width:110px; flex:none; }
  .phone-row input{ flex:1; }
  #fMachineType optgroup, #fMachineType option{ font-size:12px; }
  #fMachineType optgroup{ font-weight:700; border-top:1px solid var(--line); padding-top:4px; }
  .btn{
    display:block; width:100%; padding:14px; border:none; border-radius:8px;
    font-size:16px; font-weight:700; margin-top:18px; cursor:pointer;
  }
  .btn-primary{ background:var(--teal-deep); color:#fff; }
  .btn-primary:disabled{ opacity:0.5; }
  .center{ text-align:center; padding:40px 16px; }
  .icon-circle{
    width:56px; height:56px; border-radius:50%; margin:0 auto 16px;
    display:flex; align-items:center; justify-content:center; font-size:28px;
  }
  .ok-circle{ background:var(--ok-tint); color:var(--ok); }
  .bad-circle{ background:var(--bad-tint); color:var(--bad); }
  .err{ color:var(--bad); font-size:13px; margin-top:6px; display:none; }
  .hidden{ display:none; }
</style>
</head>

function renderSubCategory(category){
  const subSelect = document.getElementById('fSubCategory');
  const subOther = document.getElementById('fSubCategoryOther');
  subOther.classList.add('hidden');
  subOther.value = '';
  const options = SUB_CATEGORIES[category];
  if(!options || !options.length){
    subSelect.innerHTML = '<option value="">Pilih kategori dahulu</option>';
    subSelect.disabled = true;
    return;
  }
  subSelect.innerHTML = '<option value="">-- Pilih Jenis --</option>' +
    options.map(function(o){ return '<option>' + esc(o) + '</option>'; }).join('');
  subSelect.disabled = false;
}

document.getElementById('fSubmit').addEventListener('click', async function(){
  const btn = this;
  const errEl = document.getElementById('fErr');
  errEl.style.display = 'none';

  const name = document.getElementById('fName').value.trim();
  const phoneDigits = document.getElementById('fPhone').value.trim().replace(/[^0-9]/g,'').replace(/^0+/, '');
  const address = document.getElementById('fAddress').value.trim();
  const postcode = document.getElementById('fPostcode').value.trim();
  const state = document.getElementById('fState').value;
  const catSelect = document.getElementById('fCategory').value;
  const catOther = document.getElementById('fCategoryOther').value.trim();
  const category = catSelect === 'Other' ? catOther : catSelect;
  const subCategory = document.getElementById('fSubCategory').value.trim();
  const subCategoryOther = document.getElementById('fSubCategoryOther').value.trim();
  const machineType = document.getElementById('fMachineType').value.trim();
  const machineTypeOther = document.getElementById('fMachineTypeOther').value.trim();
  const notes = document.getElementById('fNotes').value.trim();

  if(!name){ errEl.textContent = 'Sila isi nama penuh.'; errEl.style.display = 'block'; return; }
  if(!phoneDigits){ errEl.textContent = 'Sila isi no. telefon.'; errEl.style.display = 'block'; return; }
  if(!address){ errEl.textContent = 'Sila isi alamat.'; errEl.style.display = 'block'; return; }
  if(catSelect === 'Other' && !catOther){ errEl.textContent = 'Sila nyatakan jenis mesin.'; errEl.style.display = 'block'; return; }
  if(subCategory === 'Lain Brand - Sila Nyatakan?' && !subCategoryOther){ errEl.textContent = 'Sila nyatakan jenama.'; errEl.style.display = 'block'; return; }
  if(machineType === 'Lain-lain - Sila Nyatakan?' && !machineTypeOther){ errEl.textContent = 'Sila nyatakan jenis mesin anda.'; errEl.style.display = 'block'; return; }

  // Poskod still has no dedicated column, so it stays folded into the address text.
  // Negeri now has its own column (submit_service_request's p_area) and is sent
  // separately below, so it's no longer duplicated into the address string.
  const fullAddress = address +
    (postcode ? ('\n' + postcode) : '');
  const subCategoryLine = subCategory === 'Lain Brand - Sila Nyatakan?' && subCategoryOther
    ? ('Jenis Servis: Lain Brand - ' + subCategoryOther)
    : (subCategory ? ('Jenis Servis: ' + subCategory) : '');
  const machineTypeLine = machineType === 'Lain-lain - Sila Nyatakan?' && machineTypeOther
    ? ('Jenis Mesin: Lain-lain - ' + machineTypeOther)
    : (machineType ? ('Jenis Mesin: ' + machineType) : '');
  const fullNotes = [subCategoryLine, machineTypeLine].filter(Boolean).join('\n') +
    (subCategoryLine || machineTypeLine ? '\n\n' : '') + notes;

  btn.disabled = true;
  btn.textContent = 'Menghantar...';
  try{
    const { data, error } = await sb.rpc('submit_service_request', {
      p_name: name,
      p_phone: '60' + phoneDigits,
      p_address: fullAddress,
      p_category: category || null,
      p_notes: fullNotes || null,
      p_area: state || null
    });
    if(error || !data){
      errEl.textContent = 'Gagal menghantar. Sila cuba lagi atau hubungi kami terus.';
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Hantar Permintaan';
      return;
    }
    renderThanks();
  }catch(e){
    errEl.textContent = 'Gagal menghantar. Sila cuba lagi atau hubungi kami terus.';
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Hantar Permintaan';
  }
});
</script>
