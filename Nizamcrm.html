<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nizam Service & Repair</title>
<style>
  :root{
    --ink:#152623;
    --ink-soft:#4b615c;
    --bg:#F5F3EC;
    --panel:#FFFFFF;
    --line:#DCE0D6;
    --teal:#0E4F4A;
    --teal-deep:#0A3A37;
    --teal-tint:#E4EFEC;
    --amber:#D98B2B;
    --amber-tint:#FBEBD4;
    --ok:#2F7D4F;
    --ok-tint:#E3F2E6;
    --warn:#C77E1B;
    --warn-tint:#FBEBD4;
    --active:#1D6FA5;
    --active-tint:#E1EEF7;
    --bad:#B4392E;
    --bad-tint:#F8E3E0;
    --radius:10px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{ touch-action:pan-x pan-y; }
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:76px;
    overscroll-behavior-y:contain;
  }
  h1,h2,h3{
    font-family:'Georgia',Cambria,serif;
    font-weight:700;
    margin:0;
    letter-spacing:-0.01em;
  }
  .topbar{
    background:#EAF3F1;
    color:var(--teal-deep);
    padding:14px 18px;
    position:sticky;
    top:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:2px solid var(--teal-tint);
  }
  .topbar .brand{
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
  }
  .topbar .brand .drop{ font-size:22px; }
  .drop-badge{
    display:flex;
    align-items:center;
    justify-content:center;
    width:60px;
    height:60px;
    flex-shrink:0;
  }
  .drop-badge img{
    width:60px;
    height:60px;
    display:block;
  }
  .topbar h1{ font-size:17px; line-height:1.2; color:var(--teal-deep); }
  .lang-toggle{
    display:flex;
    background:#fff;
    border:1px solid var(--line);
    border-radius:20px;
    padding:3px;
    flex-shrink:0;
  }
  .lang-btn{
    border:none;
    background:transparent;
    color:var(--ink-soft);
    font-size:11.5px;
    font-weight:700;
    padding:5px 10px;
    border-radius:16px;
    cursor:pointer;
    letter-spacing:.02em;
  }
  .lang-btn.active{ background:var(--teal); color:#fff; }
  .wrap{
    max-width:720px;
    margin:0 auto;
    padding:14px 14px 0;
  }
  .stat-row{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin:0 0 16px;
  }
  .stat-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px 14px;
    cursor:pointer;
    box-shadow:0 1px 2px rgba(20,40,35,.04);
  }
  .stat-card:active{ background:var(--teal-tint); }
  .filter-chip{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:var(--teal-tint);
    color:var(--teal-deep);
    font-size:12px;
    font-weight:600;
    padding:6px 10px;
    border-radius:20px;
    margin-bottom:10px;
  }
  .filter-chip button{
    background:none;
    border:none;
    color:var(--teal-deep);
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    padding:0;
    line-height:1;
  }
  .stat-card .num{
    font-family:Georgia,serif;
    font-size:24px;
    font-weight:700;
    color:var(--teal-deep);
    line-height:1.1;
  }
  .stat-card .lbl{
    font-size:11px;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:.04em;
    margin-top:4px;
  }
  .stat-card.alert .num{ color:var(--bad); }
  .section-title{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--ink-soft);
    margin:22px 2px 10px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-title::after{ content:''; flex:1; height:1px; background:var(--line); }
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:10px;
    box-shadow:0 1px 2px rgba(20,40,35,.04);
  }
  .row{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .name{ font-weight:600; font-size:15px; }
  .cust-code{ font-weight:500; color:#6b7a75; font-size:13px; }
  .sub{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .badge{
    font-size:10.5px;
    font-weight:600;
    padding:3px 8px;
    border-radius:20px;
    white-space:nowrap;
    text-transform:uppercase;
    letter-spacing:.02em;
  }
  .badge.ok{ background:var(--ok-tint); color:var(--ok); }
  .badge.warn{ background:var(--warn-tint); color:var(--warn); }
  .badge.active{ background:var(--active-tint); color:var(--active); }
  .badge.bad{ background:var(--bad-tint); color:var(--bad); }
  .badge.neutral{ background:var(--teal-tint); color:var(--teal-deep); }
  .btn{
    border:none;
    border-radius:8px;
    padding:10px 14px;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .btn-primary{ background:var(--teal); color:#fff; }
  .btn-amber{ background:var(--amber); color:#fff; }
  .btn-whatsapp{ background:#25D366; color:#fff; }
  .btn-ghost{ background:transparent; color:var(--teal-deep); border:1px solid var(--line); }
  .btn-block{ width:100%; justify-content:center; }
  .btn-sm{ padding:6px 10px; font-size:12px; }
  .btn-danger{ background:var(--bad-tint); color:var(--bad); }
  .actions{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .fab{
    position:fixed;
    bottom:70px;
    right:16px;
    width:52px;
    height:52px;
    border-radius:50%;
    background:var(--amber);
    color:#fff;
    border:none;
    box-shadow:0 4px 14px rgba(0,0,0,.25);
    cursor:pointer;
    z-index:25;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
  }
  .tabbar{
    position:fixed;
    bottom:0; left:0; right:0;
    background:var(--panel);
    border-top:1px solid var(--line);
    display:flex;
    z-index:30;
  }
  .tab{
    flex:1;
    text-align:center;
    padding:9px 0 8px;
    font-size:10.5px;
    color:var(--ink-soft);
    cursor:pointer;
    text-transform:uppercase;
    letter-spacing:.03em;
    font-weight:600;
  }
  .tab .ic{ display:flex; justify-content:center; margin-bottom:3px; }
  .tab.active .ic svg{ stroke-width:2; }
  .tab.active{ color:var(--teal); }
  .view{ display:none; }
  .view.active{ display:block; }
  .empty{ text-align:center; padding:36px 16px; color:var(--ink-soft); }
  .empty .big{
    width:56px; height:56px;
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 10px;
    border-radius:50%;
    background:var(--teal-tint);
    color:var(--teal);
  }
  input,select,textarea{
    width:100%;
    padding:11px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    font-size:16px;
    background:#fff;
    color:var(--ink);
    font-family:inherit;
    line-height:1.3;
  }
  select{
    appearance:none; -webkit-appearance:none; -moz-appearance:none;
    padding-right:34px;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%234b615c' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat;
    background-position:right 12px center;
  }
  label{
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:.03em;
    display:block;
    margin:12px 0 5px;
  }
  label:first-child{ margin-top:0; }
  .search{ margin-bottom:12px; }
  .checkbox-row{
    display:flex;
    align-items:center;
    gap:8px;
    text-transform:none;
    letter-spacing:normal;
    font-weight:500;
    color:var(--ink);
    font-size:14px;
  }
  .checkbox-row input{ width:auto; }
  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(10,20,18,.5);
    z-index:50;
    align-items:flex-end;
  }
  .modal-overlay.open{ display:flex; }
  .modal{
    background:var(--bg);
    width:100%;
    max-height:88vh;
    overflow-y:auto;
    border-radius:16px 16px 0 0;
    padding:18px 16px 24px;
  }
  .modal h2{ font-size:18px; color:var(--teal-deep); margin-bottom:4px; }
  .modal-close{
    position:absolute;
    top:14px; right:16px;
    background:none;
    border:none;
    font-size:22px;
    color:var(--ink-soft);
    cursor:pointer;
  }
  .modal-inner{ position:relative; }
  .two-col{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .footer-actions{ display:flex; gap:8px; margin:18px 2px 8px; }
  .logo-row{ display:flex; align-items:center; gap:12px; margin-bottom:4px; }
  .logo-preview{
    width:56px; height:56px;
    border-radius:8px;
    border:1px dashed var(--line);
    background:#fff;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    flex-shrink:0;
  }
  .logo-preview img{ width:100%; height:100%; object-fit:contain; }
  .lock-overlay{
    position:fixed; inset:0; z-index:9999;
    background:var(--bg);
    display:flex; align-items:center; justify-content:center; flex-direction:column;
    padding:24px;
  }
  .lock-overlay.hidden{ display:none; }
  .lock-inner{ width:100%; max-width:300px; text-align:center; }
  .lock-logo img{ width:120px; height:120px; margin-bottom:14px; }
  .lock-title{ font-family:Georgia,serif; font-weight:700; font-size:18px; color:var(--teal-deep); margin-bottom:28px; }
  .lock-dots{ display:flex; justify-content:center; gap:16px; margin-bottom:34px; }
  .lock-dot{
    width:14px; height:14px; border-radius:50%; background:var(--bg);
    box-shadow: inset 2px 2px 4px #C9C6BC, inset -2px -2px 4px #FFFFFF;
    transition: all .12s;
  }
  .lock-dot.filled{ background:var(--teal-deep); box-shadow:none; }
  .lock-dot.error{ background:var(--bad); box-shadow:none; }
  @keyframes lockshake{ 0%,100%{transform:translateX(0);} 20%,60%{transform:translateX(-8px);} 40%,80%{transform:translateX(8px);} }
  .lock-dots.shake{ animation:lockshake .4s; }
  .lock-keypad{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .lock-keypad button{
    aspect-ratio:1;
    border-radius:50%;
    border:none;
    background:var(--bg);
    font-size:22px;
    font-weight:600;
    color:var(--ink);
    cursor:pointer;
    box-shadow: 6px 6px 12px #DAD7CD, -6px -6px 12px #FFFFFF;
    transition: box-shadow .1s;
  }
  .lock-keypad button:active{
    box-shadow: inset 4px 4px 8px #DAD7CD, inset -4px -4px 8px #FFFFFF;
  }
  .lock-keypad .lock-empty{ visibility:hidden; }

  /* Desktop/laptop: keep the fixed tab bar and FAB aligned under the same centered content column instead of spanning the full browser window */
  @media (min-width:768px){
    .tabbar{
      left:50%;
      right:auto;
      transform:translateX(-50%);
      width:720px;
      max-width:100%;
      box-shadow:0 0 0 1px var(--line);
    }
    .fab{
      right:calc(50% - 360px + 16px);
    }
  }
</style>
</head>
<body>

<div class="lock-overlay" id="lockOverlay">
  <div class="lock-inner">
    <div class="lock-logo"><img id="lockLogoImg" alt=""></div>
    <div class="lock-title" data-t="lock.title"></div>
    <div class="lock-dots" id="lockDots">
      <span class="lock-dot"></span><span class="lock-dot"></span><span class="lock-dot"></span><span class="lock-dot"></span>
    </div>
    <div class="lock-keypad">
      <button onclick="pressPinDigit('1')">1</button>
      <button onclick="pressPinDigit('2')">2</button>
      <button onclick="pressPinDigit('3')">3</button>
      <button onclick="pressPinDigit('4')">4</button>
      <button onclick="pressPinDigit('5')">5</button>
      <button onclick="pressPinDigit('6')">6</button>
      <button onclick="pressPinDigit('7')">7</button>
      <button onclick="pressPinDigit('8')">8</button>
      <button onclick="pressPinDigit('9')">9</button>
      <div class="lock-empty"></div>
      <button onclick="pressPinDigit('0')">0</button>
      <button onclick="backspacePin()">⌫</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const STORE_KEY = 'aquaops_data_v1';
// Fixed platform fee deducted per completed job, in addition to the technician's own
// commission. Permanent by design — not exposed as a settings field.
const PLATFORM_FEE_PER_JOB = 3;
const LANG_KEY = 'aquaops_lang';
let DB = load();
let LANG = localStorage.getItem(LANG_KEY) || 'ms';

/* ---------- CLOUD SYNC (Supabase) ----------
   Connects this app to the same Supabase project the technician app (Nizamtech.html) uses.
   Syncs automatically every 30s while the app is open (plus whenever the tab/app regains
   focus), and can also be triggered manually via the "Sync now" button in Settings. The app
   still works fully offline in between — a sync just reconciles whatever changed since the
   last run.
*/
const SB_URL = 'https://jtlmhmlbehdaerwoqivu.supabase.co';
const SB_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp0bG1obWxiZWhkYWVyd29xaXZ1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxODc2MzIsImV4cCI6MjEwMDc2MzYzMn0.z2HK2acnYQh-3OzUS3pe74X9TC8nBt9L3eCpki2pnaM';
const sbCloud = (window.supabase && window.supabase.createClient) ? window.supabase.createClient(SB_URL, SB_ANON_KEY) : null;
const LAST_SYNC_KEY = 'aquaops_last_sync';

function setSyncStatus(msg){
  const el = document.getElementById('syncStatus');
  if(el) el.textContent = msg;
}
function refreshSyncStatusLabel(){
  const last = localStorage.getItem(LAST_SYNC_KEY);
  setSyncStatus(last ? (t('sync.lastSynced') + new Date(last).toLocaleString()) : t('sync.never'));
}

let syncInFlight = false;
let lastSyncErrors = [];
async function syncNow(){
  if(!sbCloud){ setSyncStatus(t('sync.unavailable')); return; }
  if(syncInFlight) return;
  syncInFlight = true;
  lastSyncErrors = [];
  const btn = document.getElementById('syncBtnEl');
  if(btn) btn.disabled = true;
  setSyncStatus(t('sync.inProgress'));
  try{
    await pullTechnicians();
    await pullCustomers();
    await pushTechnicians();
    await pushCustomers();
    await pushJobs();
    await pullJobStatuses();
    await pullInvoiceRecords();
    await pushInvoiceRecords();
    save();
    renderAll();
    const now = new Date();
    localStorage.setItem(LAST_SYNC_KEY, now.toISOString());
    if(lastSyncErrors.length){
      // Surface real sync errors instead of the silent swallow that used to happen here —
      // this is what made "sync this job first" persist forever with no explanation.
      setSyncStatus(t('sync.lastSynced') + now.toLocaleString() + ' — ' + lastSyncErrors.length + ' error(s): ' + lastSyncErrors.join(' | '));
    }else{
      setSyncStatus(t('sync.lastSynced') + now.toLocaleString());
    }
  }catch(e){
    setSyncStatus(t('sync.failed'));
  }
  if(btn) btn.disabled = false;
  syncInFlight = false;
}

const AUTO_SYNC_MS = 15000;
if(sbCloud){
  setInterval(function(){ syncNow(); }, AUTO_SYNC_MS);
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible') syncNow();
  });
}

// Pulls technicians who've registered on their own phone (Nizamtech.html) into the local
// technician list, matching an existing local entry by phone number where possible so a
// technician's commission/area/skills set here aren't lost.
async function pullTechnicians(){
  const { data, error } = await sbCloud.rpc('list_technicians');
  if(error){ console.error('pullTechnicians failed', error); lastSyncErrors.push('pullTechnicians: '+(error.message||JSON.stringify(error))); return; }
  if(!data) return;
  data.forEach(function(rt){
    let local = DB.technicians.find(function(x){ return x.supabaseId===rt.id; });
    if(!local){
      local = DB.technicians.find(function(x){
        return !x.supabaseId && x.phone && rt.phone && x.phone.replace(/[^0-9]/g,'')===rt.phone.replace(/[^0-9]/g,'');
      });
    }
    if(local){
      const wasLinked = !!local.supabaseId;
      local.supabaseId = rt.id;
      local.name = rt.name;
      local.phone = rt.phone;
      if(!local.area && rt.coverage_area) local.area = rt.coverage_area;
      if(!local.skills && rt.skills) local.skills = rt.skills;
      if(!local.state && rt.state) local.state = rt.state;
      // This technician just registered (wasn't linked before) — any job already assigned
      // to them locally was pushed as "unassigned" up to now, since Supabase had no matching
      // technician row to attach it to. Flag those jobs so the next push actually links them,
      // which is what makes a technician start receiving jobs the moment they register.
      if(!wasLinked){
        DB.jobs.forEach(function(j){ if(j.techId===local.id) j._dirty = true; });
      }
    } else {
      DB.technicians.push({
        id: nextId(), supabaseId: rt.id, name: rt.name, phone: rt.phone,
        area: rt.coverage_area||'', skills: rt.skills||'', state: rt.state||'',
        commType: rt.commission_type||'percent', rate: rt.commission_value||0
      });
    }
  });
}

// Pulls the FULL customer list down — needed so a device opening this CRM for the first
// time (e.g. a second admin, or a phone that's never synced before) actually gets existing
// customers instead of starting empty. Matches by supabaseId first; falls back to matching
// an unsynced local record by phone (same pattern as pullTechnicians), so a customer typed
// in independently on two devices before ever syncing merges into one record instead of
// duplicating. Otherwise creates a brand-new local record.
async function pullCustomers(){
  const { data, error } = await sbCloud.rpc('list_customers');
  if(error){ console.error('pullCustomers failed', error); lastSyncErrors.push('pullCustomers: '+(error.message||JSON.stringify(error))); return; }
  if(!data) return;
  data.forEach(function(rc){
    let local = DB.customers.find(function(x){ return x.supabaseId===rc.id; });
    if(!local){
      local = DB.customers.find(function(x){
        return !x.supabaseId && x.phone && rc.phone && x.phone.replace(/[^0-9]/g,'')===rc.phone.replace(/[^0-9]/g,'');
      });
    }
    if(local){
      local.supabaseId = rc.id;
      // Don't clobber a local edit that hasn't been pushed up yet.
      if(!local._dirty){
        local.name = rc.name; local.phone = rc.phone||''; local.address = rc.address||'';
        local.area = rc.area||''; local.brand = rc.brand||''; local.model = rc.model||'';
        local.lastService = rc.last_service_date||''; local.recurring = rc.recurring!==false;
        local.notes = rc.notes||'';
      }
    } else {
      DB.customers.push({
        id: nextId(), supabaseId: rc.id, name: rc.name, phone: rc.phone||'',
        address: rc.address||'', area: rc.area||'', brand: rc.brand||'', model: rc.model||'',
        lastService: rc.last_service_date||'', recurring: rc.recurring!==false, notes: rc.notes||''
      });
    }
  });
}

// Pushes new/changed technicians up. A technician created directly through the CRM's "Add
// technician" form previously never reached Supabase at all — there was no insert call, only
// updates for technicians that already had a supabaseId (i.e. had self-registered on
// Nizamtech.html first). That technician now gets inserted as a *placeholder* row (no PIN set
// yet — pin_hash left null server-side), so they show up on every synced device right away.
// If that same person later self-registers on Nizamtech.html with the matching phone number,
// register_technician() (Supabase-side, Phase 12) claims this placeholder row and sets the
// PIN on it, instead of blocking them or creating a duplicate technician.
// A technician with no phone on file is skipped — phone is required/unique in Supabase, and
// there'd be no way to match their eventual self-registration to this row anyway.
async function pushTechnicians(){
  for(const tc of DB.technicians){
    if(tc.supabaseId && !tc._dirty) continue;
    if(!tc.phone) continue;
    if(tc.supabaseId){
      const { error } = await sbCloud.rpc('update_technician_profile', {
        p_id: tc.supabaseId, p_coverage_area: tc.area||null, p_skills: tc.skills||null,
        p_commission_type: tc.commType, p_commission_value: tc.rate||0, p_state: tc.state||null
      });
      if(!error){ delete tc._dirty; }
      else{
        console.error('pushTechnicians (update) failed for', tc.name, error);
        lastSyncErrors.push('Technician "'+tc.name+'": '+(error.message||JSON.stringify(error)));
      }
    } else {
      const { data, error } = await sbCloud.rpc('insert_technician_placeholder', {
        p_name: tc.name, p_phone: tc.phone, p_coverage_area: tc.area||null,
        p_skills: tc.skills||null, p_commission_type: tc.commType,
        p_commission_value: tc.rate||0, p_state: tc.state||null
      });
      if(!error && data){ tc.supabaseId = data; delete tc._dirty; }
      else if(error){
        console.error('pushTechnicians (insert) failed for', tc.name, error);
        lastSyncErrors.push('Technician "'+tc.name+'": '+(error.message||JSON.stringify(error)));
      }
    }
  }
}

// Pushes new/changed customers up so jobs assigned to a technician carry real customer info.
async function pushCustomers(){
  for(const c of DB.customers){
    if(c.supabaseId && !c._dirty) continue;
    const { data, error } = await sbCloud.rpc('upsert_customer', {
      p_id: c.supabaseId || null, p_name: c.name, p_phone: c.phone||null,
      p_address: c.address||null, p_area: c.area||null, p_brand: c.brand||null,
      p_model: c.model||null, p_last_service_date: c.lastService||null,
      p_recurring: c.recurring!==false, p_notes: c.notes||null
    });
    if(!error && data){ c.supabaseId = data; delete c._dirty; }
    else if(error){
      console.error('pushCustomers failed for', c.name, error);
      lastSyncErrors.push('Customer "'+c.name+'": '+(error.message||JSON.stringify(error)));
    }
  }
}

// Pushes new/changed jobs up, including the assigned technician (if that technician has
// synced/registered — see pullTechnicians). A job assigned to a technician who hasn't
// registered yet is pushed as unassigned until they do.
async function pushJobs(){
  for(const j of DB.jobs){
    if(j.supabaseId && !j._dirty) continue;
    const c = DB.customers.find(function(x){return x.id===j.custId;});
    if(!c || !c.supabaseId){
      // This is the exact case that produces "sync this job first" even after a sync
      // ran: the job's own customer never got a supabaseId (usually because pushing
      // that customer errored above), so the job is skipped on every pass, silently,
      // forever — until now, when that error actually gets surfaced.
      if(c) lastSyncErrors.push('Job for "'+c.name+'" skipped: customer has not synced yet.');
      continue;
    }
    const tc = DB.technicians.find(function(x){return x.id===j.techId;});
    const { data, error } = await sbCloud.rpc('upsert_job', {
      p_id: j.supabaseId || null, p_customer_id: c.supabaseId,
      p_technician_id: (tc && tc.supabaseId) || null,
      p_job_date: j.date, p_status: j.status, p_amount: j.amount||0,
      p_notes: j.notes||null, p_invoice_no: j.invoiceNo||null,
      p_tech_commission: jobTechCommission(j)
    });
    if(!error && data){ j.supabaseId = data; delete j._dirty; }
    else if(error){
      console.error('pushJobs failed for job of', c.name, error);
      lastSyncErrors.push('Job for "'+c.name+'": '+(error.message||JSON.stringify(error)));
    }
  }
}

// Pushes new invoice log entries up. job_id/customer_id are sent as null if that job or
// customer hasn't synced yet — the log entry is still useful (invoice_no/customer_name/
// amount are all local snapshots, not live references), just without the FK linkage until
// a later push.
async function pushInvoiceRecords(){
  for(const r of DB.invoices){
    if(r.supabaseId && !r._dirty) continue;
    const c = DB.customers.find(function(x){return x.id===r.custId;});
    const j = DB.jobs.find(function(x){return x.id===r.jobId;});
    const { data, error } = await sbCloud.rpc('upsert_invoice_record', {
      p_id: r.supabaseId || null, p_job_id: (j && j.supabaseId) || null,
      p_customer_id: (c && c.supabaseId) || null, p_invoice_no: r.invoiceNo,
      p_customer_name: r.custName || null, p_amount: r.amount || 0
    });
    if(!error && data){ r.supabaseId = data; delete r._dirty; }
    else if(error){
      console.error('pushInvoiceRecords failed for', r.invoiceNo, error);
      lastSyncErrors.push('Invoice "'+r.invoiceNo+'": '+(error.message||JSON.stringify(error)));
    }
  }
}

// Pulls the full invoice log down — same reasoning as pullCustomers(): a device syncing
// for the first time needs to see records created on other devices too, not just its own.
async function pullInvoiceRecords(){
  const { data, error } = await sbCloud.rpc('list_invoice_records');
  if(error){ console.error('pullInvoiceRecords failed', error); lastSyncErrors.push('pullInvoiceRecords: '+(error.message||JSON.stringify(error))); return; }
  if(!data) return;
  data.forEach(function(ri){
    let local = DB.invoices.find(function(x){ return x.supabaseId===ri.id; });
    if(!local){
      local = DB.invoices.find(function(x){ return !x.supabaseId && x.invoiceNo===ri.invoice_no; });
    }
    const localJob = DB.jobs.find(function(x){ return x.supabaseId===ri.job_id; });
    const localCust = DB.customers.find(function(x){ return x.supabaseId===ri.customer_id; });
    if(local){
      local.supabaseId = ri.id;
      if(!local._dirty){
        local.invoiceNo = ri.invoice_no; local.custName = ri.customer_name||'';
        local.amount = ri.amount||0; local.issuedAt = ri.issued_at||local.issuedAt;
        if(localJob) local.jobId = localJob.id;
        if(localCust) local.custId = localCust.id;
      }
    } else {
      DB.invoices.push({
        id: nextId(), supabaseId: ri.id, jobId: localJob?localJob.id:null,
        custId: localCust?localCust.id:null, invoiceNo: ri.invoice_no,
        custName: ri.customer_name||'', amount: ri.amount||0, issuedAt: ri.issued_at||''
      });
    }
  });
}

// Pulls back the status a technician has set on their phone — starting a job ("in progress")
// and marking it done, including what they logged as done/changed — and reflects it on the
// matching local job. Admin-set statuses (new/assigned/cancelled) are left alone here; only
// the technician-driven states flow back in.
// Pulls back job statuses/completions the technician-facing side (start_job/complete_job/
// job-form.html) has changed — AND, for a device that's never seen a given job before
// (e.g. a fresh device, a second admin), creates it locally so the job actually shows up
// instead of silently never appearing. Requires the job's customer to already exist locally
// (via pullCustomers, which runs earlier in syncNow) — if not, it's skipped this pass and
// picked up on the next one once the customer has synced.
async function pullJobStatuses(){
  const { data, error } = await sbCloud.rpc('list_jobs');
  if(error){ console.error('pullJobStatuses failed', error); lastSyncErrors.push('pullJobStatuses: '+(error.message||JSON.stringify(error))); return; }
  if(!data) return;
  const techDriven = { in_progress:true, done:true };
  data.forEach(function(rj){
    let local = DB.jobs.find(function(x){ return x.supabaseId===rj.id; });
    if(!local){
      const localCust = DB.customers.find(function(x){ return x.supabaseId===rj.customer_id; });
      if(!localCust) return;
      const localTech = DB.technicians.find(function(x){ return x.supabaseId===rj.technician_id; });
      DB.jobs.push({
        id: nextId(), supabaseId: rj.id, custId: localCust.id, techId: localTech?localTech.id:null,
        date: rj.job_date, status: rj.status, amount: rj.amount||0, notes: rj.notes||'',
        completedNotes: rj.completed_notes||'', completedAt: rj.completed_at||'',
        invoiceNo: rj.invoice_no||'', techComm: rj.tech_commission||0, appointmentAt: rj.appointment_at||null
      });
      return;
    }
    if(typeof rj.tech_commission === 'number') local.techComm = rj.tech_commission;
    // Appointment can be set/changed by the technician any time before the form locks
    // (independent of status), so this isn't gated by techDriven/status like the rest.
    if(rj.appointment_at !== undefined && rj.appointment_at !== local.appointmentAt) local.appointmentAt = rj.appointment_at;
    if(techDriven[rj.status] && rj.status !== local.status){
      local.status = rj.status;
      if(rj.status === 'done'){
        local.completedNotes = rj.completed_notes || '';
        local.completedAt = rj.completed_at || '';
        const c = DB.customers.find(function(x){return x.id===local.custId;});
        if(c) c.lastService = local.date;
      }
    }
  });
}

// value (so existing customer records, technician skill-matching, and invoices are
// unaffected); only the option text shown to the user changes with LANG.
const CATEGORY_LABELS_EN = {
  'Water Dispenser/Penapis Air':'Water Dispenser/Filter', 'Filter Outdoor':'Outdoor Filter',
  'Aircond':'Air Conditioner', 'Peti Sejuk':'Refrigerator', 'Kipas Remote':'Remote Fan',

};
function categoryLabel(cat){ return (LANG==='en' && CATEGORY_LABELS_EN[cat]) || cat; }
const STATE_LIST = ['Johor','Kedah','Kelantan','Melaka','Negeri Sembilan','Pahang','Perak',
  'Perlis','Pulau Pinang','Sabah','Sarawak','Selangor','Terengganu',
  'WP Kuala Lumpur','WP Labuan','WP Putrajaya'];
function buildStateSelect(selectId, currentVal){
  let html = '<select id="'+selectId+'">';
  html += '<option value=""'+(!currentVal?' selected':'')+'>'+t('field.choose')+'</option>';
  STATE_LIST.forEach(function(s){
    html += '<option value="'+esc(s)+'"'+(currentVal===s?' selected':'')+'>'+esc(s)+'</option>';
  });
  html += '</select>';
  return html;
}

function normalizeDB(db){
  if(!db) db = { customers:[], technicians:[], jobs:[], invoices:[], settings:{}, seq:1 };
  if(!db.customers) db.customers = [];
  if(!db.technicians) db.technicians = [];
  if(!db.jobs) db.jobs = [];
  if(!db.invoices) db.invoices = [];
  if(!db.settings) db.settings = {};
  if(typeof db.settings.intervalMonths !== 'number') db.settings.intervalMonths = 3;
  if(!db.settings.business) db.settings.business = {name:'',phone:'',address:'',payment:'',logo:'',qr:''};
  if(typeof db.settings.business.logo !== 'string') db.settings.business.logo = '';
  if(typeof db.settings.business.qr !== 'string') db.settings.business.qr = '';
  if(typeof db.settings.pin !== 'string' || !/^\d{4}$/.test(db.settings.pin)) db.settings.pin = '0000';
  if(typeof db.invSeq !== 'number') db.invSeq = 1;
  if(typeof db.seq !== 'number') db.seq = 1;
  if(typeof db.custSeq !== 'number') db.custSeq = 1;
  db.customers.forEach(function(c){ if(typeof c.recurring !== 'boolean') c.recurring = true; });
  db.technicians.forEach(function(tc){ tc.commType = 'fixed'; });
  // Backfill customer codes for records saved before this feature existed.
  // Assign in existing array order so earlier customers keep lower numbers.
  db.customers.forEach(function(c){
    if(!c.code){ c.code = String(db.custSeq).padStart(3,'0'); db.custSeq++; }
  });
  return db;
}
function load(){
  let db = null;
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw) db = JSON.parse(raw);
  }catch(e){}
  return normalizeDB(db);
}
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }
function nextId(){ return 'id' + (DB.seq++); }
function nextCustCode(){ return String(DB.custSeq++).padStart(3,'0'); }
function fmtMoney(n){ return 'RM' + (Math.round((n||0)*100)/100).toLocaleString('en-MY',{minimumFractionDigits:0}); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function daysBetween(a,b){ return Math.round((new Date(b) - new Date(a)) / 86400000); }
// Hardcoded month names instead of relying on the browser's toLocaleDateString ICU data —
// Android's built-in ms-MY locale data is inconsistent across devices (some abbreviate
// "Ogos" down to "Ogo", which isn't a real Malay abbreviation). This makes date text
// deterministic regardless of device/browser locale data.
const MONTHS_BM = ['Jan','Feb','Mac','Apr','Mei','Jun','Jul','Ogos','Sep','Okt','Nov','Dis'];
const MONTHS_EN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d+'T00:00:00');
  const months = LANG==='ms' ? MONTHS_BM : MONTHS_EN;
  return dt.getDate() + ' ' + months[dt.getMonth()] + ' ' + dt.getFullYear();
}
function fmtDateTime(iso){
  if(!iso) return '—';
  const dt = new Date(iso);
  if(isNaN(dt)) return '—';
  // Malaysia is a fixed UTC+8 offset (no DST) — shift explicitly rather than relying on
  // getHours()/getDate(), which use whatever timezone the viewing device happens to be
  // set to. Keeps this correct even if a phone's timezone setting is wrong.
  const my = new Date(dt.getTime() + 8*60*60*1000);
  const months = LANG==='ms' ? MONTHS_BM : MONTHS_EN;
  const h = my.getUTCHours(), m = String(my.getUTCMinutes()).padStart(2,'0');
  const h12 = ((h % 12) || 12);
  const ampm = h < 12 ? 'AM' : 'PM';
  return my.getUTCDate() + ' ' + months[my.getUTCMonth()] + ' ' + my.getUTCFullYear() + ', ' + h12 + ':' + m + ' ' + ampm;
}

async function deleteCustomer(id){
  if(!confirm(t('cust.confirmDelete'))) return;
  const c = DB.customers.find(function(x){return x.id===id;});
  DB.customers = DB.customers.filter(function(x){return x.id!==id;});
  save(); closeModal(); renderAll();
  // Best-effort: if this customer was ever synced, delete it in Supabase too so it
  // doesn't keep living in the cloud after being removed here. If the device is
  // offline this silently fails — there's no retry/queue for deletes yet, so an
  // offline delete needs to be repeated once back online.
  if(c && c.supabaseId){
    try{ await sbCloud.rpc('delete_customer', { p_id: c.supabaseId }); }catch(e){}

function nextDueDate(c){
  if(!c.recurring) return null;
  if(!c.lastService) return null;
  const d = new Date(c.lastService+'T00:00:00');
  d.setMonth(d.getMonth() + (c.intervalMonths || DB.settings.intervalMonths || 3));
  return d.toISOString().slice(0,10);
}
function dueStatus(c){
  if(!c.recurring) return {label:t('cust.oneOff'), cls:'neutral'};
  const due = nextDueDate(c);
  if(!due) return {label:t('cust.noHistory'), cls:'neutral'};
  const diff = daysBetween(todayISO(), due);
  if(diff < 0) return {label:t('cust.overdue') + fmtDate(due), cls:'bad'};
  if(diff <= 7) return {label:t('cust.dueSoon') + fmtDate(due), cls:'warn'};
  return {label:t('cust.upcoming') + fmtDate(due), cls:'ok'};
}
function custSortRank(c){
  const st = dueStatus(c);
  return (st.cls==='bad' || st.cls==='warn') ? 0 : 1;
}
function renderCustomers(){
  const q = (document.getElementById('custSearch').value||'').toLowerCase();
  const list = DB.customers
    .filter(function(c){ return !q || c.name.toLowerCase().includes(q) || (c.phone||'').includes(q) || (c.area||'').toLowerCase().includes(q) || (c.code||'').toLowerCase().includes(q); })
    .sort(function(a,b){
      const ra = custSortRank(a), rb = custSortRank(b);
      if(ra !== rb) return ra - rb;
      if(ra === 0) return nextDueDate(a).localeCompare(nextDueDate(b));
      return a.name.localeCompare(b.name);
    });
  const el = document.getElementById('customersList');
  if(list.length===0){ el.innerHTML = emptyState(ICON.userplus, t('cust.emptyTitle'), t('cust.emptySub')); return; }
  el.innerHTML = list.map(function(c){
    const st = dueStatus(c);
    return '<div class="card" onclick="openCustomerForm(\''+c.id+'\')">' +
      '<div class="row"><div>' +

        '<div class="sub">'+esc(c.phone||'')+'</div>' +

  }).join('');
}

  const cat = category.toLowerCase().trim();
  return tc.skills.toLowerCase().split(',').some(function(s){
    s = s.trim();
    return s && (cat.includes(s) || s.includes(cat));
  });

    return a.name.localeCompare(b.name);

  techs.forEach(function(tc){
    const star = techMatchesCategory(tc,category) ? '\u2605 ' : '';
    html += '<option value="'+tc.id+'"'+(selectedId===tc.id?' selected':'')+'>'+star+esc(tc.name)+(tc.skills?' \u2014 '+esc(tc.skills):'')+'</option>';

async function saveJob(id){
  const custId = document.getElementById('jCust').value;
  const data = {
    custId: custId,
    techId: document.getElementById('jTech').value || null,
    techComm: parseFloat(document.getElementById('jTechComm').value)||0,
    date: document.getElementById('jDate').value || todayISO(),
    status: document.getElementById('jobStatus').value,
    amount: parseFloat(document.getElementById('jAmount').value)||0,
    notes: document.getElementById('jNotes').value.trim(),
    _dirty: true
  };
  if(id){ Object.assign(DB.jobs.find(function(x){return x.id===id;}), data); }
  else { data.id = nextId(); data.created = todayISO(); DB.jobs.push(data); }
  if(data.status==='done'){
    const c = DB.customers.find(function(x){return x.id===custId;});
    if(c) c.lastService = data.date;
  }
  save(); closeModal(); renderAll();
  // Push right away instead of waiting for the next auto-sync cycle — otherwise a job
  // saved seconds ago has no supabaseId yet, and "Send job report link" fails with
  // "sync this job first" even though the user just saved. Best-effort: if offline,
  // this silently does nothing and the regular auto-sync picks it up once back online.
  if(sbCloud){
    try{ await pushJobs(); save(); renderAll(); }catch(e){}
  }
}
async function deleteJob(id){
  if(!confirm(t('job.confirmDelete'))) return;
  const j = DB.jobs.find(function(x){return x.id===id;});
  DB.jobs = DB.jobs.filter(function(x){return x.id!==id;});
  save(); closeModal(); renderAll();
  // Same best-effort remote delete as deleteCustomer() above.
  if(j && j.supabaseId){
    try{ await sbCloud.rpc('delete_job', { p_id: j.supabaseId }); }catch(e){}
  }
}

function wrapText(ctx, text, maxWidth){
  const paragraphs = String(text||'').split('\n');
  let lines = [];
  paragraphs.forEach(function(p){
    const words = p.split(' ');
    let line = '';
    for(let i=0;i<words.length;i++){
      const test = line ? line+' '+words[i] : words[i];
      if(line && ctx.measureText(test).width > maxWidth){
        lines.push(line);
        line = words[i];
      } else {
        line = test;
      }
    }
    lines.push(line);
  });
  return lines;
}
function loadImagePromise(src){
  return new Promise(function(resolve){
    if(!src){ resolve(null); return; }
    const img = new Image();
    img.onload = function(){ resolve(img); };
    img.onerror = function(){ resolve(null); };
    img.src = src;
  });
}
function renderInvoicePNG(j, c, biz){
  return Promise.all([loadImagePromise(biz.logo), loadImagePromise(biz.qr)]).then(function(imgs){
    const logoImg = imgs[0], qrImg = imgs[1];
    const W = 800, PAD = 44, contentW = W - PAD*2;
    const RENDER_SCALE = 3; // preview-image pixel density only; the real PDF below is vector, not scaled pixels
    const SCRATCH_H = 1800;
    const scratch = document.createElement('canvas');
    scratch.width = W*RENDER_SCALE; scratch.height = SCRATCH_H*RENDER_SCALE;
    const ctx = scratch.getContext('2d');
    ctx.scale(RENDER_SCALE, RENDER_SCALE);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0,0,W,SCRATCH_H);

    // Every draw below is logged here (real text + line + image placements, in the same
    // 800px-wide logical coordinate space as the canvas). This log is what buildVectorInvoicePDF
    // uses afterwards to write actual PDF text operators instead of flattening everything to one JPEG.
    const layout = [];

    function drawText(str, x, y, opts){
      opts = opts || {};
      const size = opts.size || 13, bold = !!opts.bold, serif = !!opts.serif;
      const color = opts.color || '#000000', align = opts.align || 'left';
      const family = serif ? '"Times New Roman", Georgia, serif' : 'Arial';
      ctx.font = (bold?'bold ':'') + size + 'px ' + family;
      ctx.fillStyle = color;
      ctx.textAlign = align;
      ctx.fillText(str, x, y);
      const w = ctx.measureText(str).width;
      const leftX = align==='right' ? x - w : (align==='center' ? x - w/2 : x);
      layout.push({type:'text', str:str, leftX:leftX, y:y, size:size, bold:bold, serif:serif, color:color});
    }
    function drawLine(x1,y1,x2,y2,color,width){
      ctx.strokeStyle = color; ctx.lineWidth = width;
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      layout.push({type:'line', x1:x1, y1:y1, x2:x2, y2:y2, color:color, width:width});
    }
    function drawImg(img, name, x, y, w, h, smooth){
      if(smooth===false) ctx.imageSmoothingEnabled = false;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, x, y, w, h);
      ctx.imageSmoothingEnabled = true;
      layout.push({type:'image', name:name, x:x, y:y, w:w, h:h});
    }

    const bizName = biz.name || 'Nizam Service & Repair';
    ctx.font = '13px Arial';
    const bizDetailLines = wrapText(ctx, [biz.phone, biz.address].filter(Boolean).join('\n'), contentW*0.5);

    const custBlock = [];
    if(c){
      custBlock.push(c.name);
      if(c.phone) custBlock.push(c.phone);
      if(c.address) custBlock.push(c.address);
      if(c.area) custBlock.push(c.area);
    } else { custBlock.push('—'); }
    let custLines = [];
    custBlock.forEach(function(line){ custLines = custLines.concat(wrapText(ctx, line, contentW)); });

    const serviceDesc = t('inv.serviceLine') + (c && c.brand ? ' — ' + c.brand + (c.model?' ('+c.model+')':'') : '');
    ctx.font = '14px Arial';
    const descLines = wrapText(ctx, serviceDesc, contentW*0.72);
    ctx.font = '12px Arial';
    const notesLines = j.notes ? wrapText(ctx, j.notes, contentW*0.72) : [];
    const payLines = biz.payment ? (function(){ ctx.font='13px Arial'; return wrapText(ctx, biz.payment, contentW); })() : [];

    let headerLeftX = PAD;
    if(logoImg){
      drawImg(logoImg, 'logo', PAD, PAD, 48, 48);
      headerLeftX = PAD + 48 + 12;
    }
    drawText(bizName, headerLeftX, PAD + 22, {size:20, bold:true, serif:true, color:'#0A3A37'});
    let by = PAD + 42;
    bizDetailLines.forEach(function(line){ drawText(line, headerLeftX, by, {size:13, color:'#555555'}); by += 17; });

    drawText(t('inv.title'), W - PAD, PAD + 24, {size:26, bold:true, serif:true, color:'#0E4F4A', align:'right'});
    drawText(t('inv.no')+': '+j.invoiceNo, W-PAD, PAD+44, {size:12, color:'#555555', align:'right'});
    drawText(t('inv.date')+': '+fmtDate(j.date), W-PAD, PAD+60, {size:12, color:'#555555', align:'right'});

    let headerBottom = Math.max(by, PAD + 66) + 14;
    drawLine(PAD, headerBottom, W-PAD, headerBottom, '#0E4F4A', 3);

    let yy = headerBottom + 26;
    drawText(t('inv.billTo').toUpperCase(), PAD, yy, {size:11, color:'#888888'});
    yy += 18;
    custLines.forEach(function(line, idx){
      drawText(line, PAD, yy, idx===0 ? {size:15, bold:true, color:'#152623'} : {size:13, color:'#152623'});
      yy += 18;
    });

    yy += 14;
    drawText(t('inv.desc').toUpperCase(), PAD, yy, {size:11, color:'#888888'});
    drawText(t('inv.amount').toUpperCase(), W-PAD, yy, {size:11, color:'#888888', align:'right'});
    yy += 8;
    drawLine(PAD, yy, W-PAD, yy, '#dddddd', 1);
    yy += 22;

    const rowTopY = yy;
    descLines.forEach(function(line){ drawText(line, PAD, yy, {size:14, color:'#152623'}); yy += 18; });
    if(notesLines.length){
      notesLines.forEach(function(line){ drawText(line, PAD, yy, {size:12, color:'#888888'}); yy += 16; });
    }
    drawText(fmtMoney(j.amount), W-PAD, rowTopY, {size:14, color:'#152623', align:'right'});

    yy += 14;
    drawLine(PAD, yy, W-PAD, yy, '#eeeeee', 1);
    yy += 26;

    drawText(t('inv.total'), PAD, yy, {size:16, bold:true, color:'#152623'});
    drawText(fmtMoney(j.amount), W-PAD, yy, {size:16, bold:true, color:'#152623', align:'right'});
    yy += 10;
    drawLine(PAD, yy, W-PAD, yy, '#0E4F4A', 2);
    yy += 30;

    if(payLines.length || qrImg){
      const paySectionTop = yy;
      if(payLines.length){
        drawText(t('inv.paymentInfo').toUpperCase(), PAD, yy, {size:11, color:'#888888'});
        yy += 18;
        payLines.forEach(function(line){ drawText(line, PAD, yy, {size:13, color:'#152623'}); yy += 17; });
      }
      if(qrImg){
        const qrSize = 150;
        const qrX = W - PAD - qrSize;
        const qrTargetPx = qrSize * RENDER_SCALE;
        const isUpscaling = qrImg.width < qrTargetPx && qrImg.height < qrTargetPx;
        drawImg(qrImg, 'qr', qrX, paySectionTop, qrSize, qrSize, !isUpscaling);
        drawText(t('inv.qrScan'), qrX + qrSize/2, paySectionTop + qrSize + 12, {size:10, color:'#888888', align:'center'});
        yy = Math.max(yy, paySectionTop + qrSize + 12);
      }
      yy += 14;
    }
    drawText(t('inv.thankyou'), PAD, yy, {size:12, color:'#666666'});

    const finalH = Math.ceil(yy + PAD);
    const finalCanvas = document.createElement('canvas');
    finalCanvas.width = W*RENDER_SCALE; finalCanvas.height = finalH*RENDER_SCALE;
    finalCanvas.getContext('2d').drawImage(scratch, 0, 0, W*RENDER_SCALE, finalH*RENDER_SCALE, 0, 0, W*RENDER_SCALE, finalH*RENDER_SCALE);

    // Preview image is exported as a data: URL (not a blob: object URL) because blob URLs
    // assigned to an <img> injected via innerHTML can fail to decode on first paint on some
    // Android Chrome/WebView builds (the element is often still display:none when the src is
    // set), leaving a permanent broken-image icon even though the blob itself is valid. A
    // data: URL has no such async decode/registry step, so it paints reliably every time.
    const previewDataUrl = finalCanvas.toDataURL('image/jpeg', 0.85);
    return new Promise(function(resolve, reject){
      finalCanvas.toBlob(function(previewBlob){
        if(!previewBlob){ reject(new Error('toBlob failed')); return; }
        Promise.all([encodeImageForPDF(logoImg), encodeImageForPDF(qrImg)]).then(function(encoded){
          const images = [];
          if(encoded[0]) images.push({ name:'logo', bytes:encoded[0].bytes, width:encoded[0].width, height:encoded[0].height });
          if(encoded[1]) images.push({ name:'qr', bytes:encoded[1].bytes, width:encoded[1].width, height:encoded[1].height });
          const pdfBytes = buildVectorInvoicePDF(layout, W, finalH, images);
          resolve({ previewDataUrl: previewDataUrl, pdfBlob: new Blob([pdfBytes], {type:'application/pdf'}) });
        }).catch(reject);
      }, 'image/jpeg', 0.85);
    });
  });
}
// Re-encodes an uploaded logo/QR image (whatever format it was uploaded as) onto a plain
// white background and re-exports as JPEG, so it can be embedded into the PDF as a small,
// self-contained DCTDecode image object — at its own native resolution, not blown up to
// cover the whole page like the old approach did.
function encodeImageForPDF(img){
  if(!img) return Promise.resolve(null);
  return new Promise(function(resolve){
    const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
    if(!w || !h){ resolve(null); return; }
    const cnv = document.createElement('canvas');
    cnv.width = w; cnv.height = h;
    const cctx = cnv.getContext('2d');
    cctx.fillStyle = '#ffffff';
    cctx.fillRect(0,0,w,h);
    cctx.drawImage(img, 0, 0, w, h);
    cnv.toBlob(function(blob){
      if(!blob){ resolve(null); return; }
      blob.arrayBuffer().then(function(buf){
        resolve({ bytes: new Uint8Array(buf), width: w, height: h });
      }).catch(function(){ resolve(null); });
    }, 'image/jpeg', 0.95);
  });
}
// Builds a real vector PDF from the drawing log captured above: actual text-drawing (Tj)
// operators using the PDF standard fonts (no font embedding needed), plus the logo/QR as
// small embedded JPEGs. This is what the old renderer didn't do — it rasterized the entire
// invoice (including all the text) into one big JPEG and stuffed that into the PDF, which is
// why it always looked soft next to a normal invoice PDF with crisp, scalable text.
function buildVectorInvoicePDF(layout, pageWpx, pageHpx, images){
  const PXTOPT = 0.75; // 96 CSS px/in -> 72 PDF pt/in, same ratio the old renderer used
  const pageW = pageWpx*PXTOPT, pageH = pageHpx*PXTOPT;
  const FONTKEY = { 'sans-normal':'F1', 'sans-bold':'F2', 'serif-bold':'F3', 'serif-normal':'F4' };
  const FONTNAME = { F1:'Helvetica', F2:'Helvetica-Bold', F3:'Times-Bold', F4:'Times-Roman' };
  // PDF's standard-14 fonts only support single-byte WinAnsi text, so a small set of common
  // typographic characters (em dash etc.) are folded down to plain ASCII equivalents here.
  const ASCII_FALLBACK = { 0x2014:'-', 0x2013:'-', 0x2018:"'", 0x2019:"'", 0x201C:'"', 0x201D:'"', 0x2026:'...', 0x2022:'-' };
  function esc(str){
    let out = '';
    for(const ch of String(str==null?'':str)){
      const code = ch.codePointAt(0);
      const mapped = code>127 ? (ASCII_FALLBACK[code] || '?') : ch;
      for(const mc of mapped){
        if(mc==='\\') out += '\\\\';
        else if(mc==='(') out += '\\(';
        else if(mc===')') out += '\\)';
        else out += mc;
      }
    }
    return out;
  }
  function rgb01(hex){
    const m = /^#?([0-9a-f]{6})$/i.exec(String(hex||'#000000').replace('#',''));
    const n = m ? parseInt(m[1],16) : 0;
    return [((n>>16)&255)/255, ((n>>8)&255)/255, (n&255)/255];
  }

  const imageNums = {}; // populated once object numbers are assigned below

  let cs = 'q\n';
  layout.forEach(function(item){
    if(item.type==='line'){
      const rgb = rgb01(item.color);
      const x1=item.x1*PXTOPT, y1=pageH-item.y1*PXTOPT, x2=item.x2*PXTOPT, y2=pageH-item.y2*PXTOPT;
      cs += rgb[0].toFixed(3)+' '+rgb[1].toFixed(3)+' '+rgb[2].toFixed(3)+' RG '+(item.width||1).toFixed(2)+' w\n';
      cs += x1.toFixed(2)+' '+y1.toFixed(2)+' m '+x2.toFixed(2)+' '+y2.toFixed(2)+' l S\n';
    } else if(item.type==='text'){
      const rgb = rgb01(item.color);
      const key = FONTKEY[(item.serif?'serif':'sans')+'-'+(item.bold?'bold':'normal')] || 'F1';
      const size = item.size*PXTOPT;
      const x = item.leftX*PXTOPT, y = pageH - item.y*PXTOPT;
      cs += 'BT /'+key+' '+size.toFixed(2)+' Tf '+rgb[0].toFixed(3)+' '+rgb[1].toFixed(3)+' '+rgb[2].toFixed(3)+' rg 1 0 0 1 '+x.toFixed(2)+' '+y.toFixed(2)+' Tm ('+esc(item.str)+') Tj ET\n';
    } else if(item.type==='image'){
      // imageNums gets filled in just below, before this content stream is actually used
      const w = item.w*PXTOPT, h = item.h*PXTOPT;
      const x = item.x*PXTOPT, y = pageH - (item.y+item.h)*PXTOPT;
      cs += '__IMG_'+item.name+'__ '+w.toFixed(2)+' 0 0 '+h.toFixed(2)+' '+x.toFixed(2)+' '+y.toFixed(2)+' cm /'+item.name+' Do Q\n';
    }
  });
  cs += 'Q';
  // q/Q wrapping for images: replace the placeholder with a plain 'q' now that we know
  // every referenced image actually has bytes (skip drawing any that failed to encode).
  const availableImages = {}; images.forEach(function(im){ availableImages[im.name] = true; });
  cs = cs.split('\n').filter(function(line){
    const m = /^__IMG_(\w+)__/.exec(line);
    if(!m) return true;
    return !!availableImages[m[1]];
  }).map(function(line){
    return line.replace(/^__IMG_\w+__/, 'q');
  }).join('\n');

  const enc = new TextEncoder();
  const chunks = []; const offsets = {}; let pos = 0;
  function push(part){ const b = (typeof part==='string') ? enc.encode(part) : part; chunks.push(b); pos += b.length; }

  push('%PDF-1.4\n');
  let n = 1;
  const catalogNum = n++, pagesNum = n++, pageNum = n++;
  const fontNums = { F1:n++, F2:n++, F3:n++, F4:n++ };
  images.forEach(function(im){ imageNums[im.name] = n++; });
  const contentNum = n++;

  offsets[catalogNum]=pos; push(catalogNum+' 0 obj\n<< /Type /Catalog /Pages '+pagesNum+' 0 R >>\nendobj\n');
  offsets[pagesNum]=pos; push(pagesNum+' 0 obj\n<< /Type /Pages /Kids ['+pageNum+' 0 R] /Count 1 >>\nendobj\n');

  const fontDict = ['F1','F2','F3','F4'].map(function(k){ return '/'+k+' '+fontNums[k]+' 0 R'; }).join(' ');
  const xobjDict = images.map(function(im){ return '/'+im.name+' '+imageNums[im.name]+' 0 R'; }).join(' ');
  offsets[pageNum]=pos; push(pageNum+' 0 obj\n<< /Type /Page /Parent '+pagesNum+' 0 R /MediaBox [0 0 '+pageW.toFixed(2)+' '+pageH.toFixed(2)+'] /Resources << /Font << '+fontDict+' >> /XObject << '+xobjDict+' >> >> /Contents '+contentNum+' 0 R >>\nendobj\n');

  ['F1','F2','F3','F4'].forEach(function(k){
    offsets[fontNums[k]]=pos;
    push(fontNums[k]+' 0 obj\n<< /Type /Font /Subtype /Type1 /BaseFont /'+FONTNAME[k]+' /Encoding /WinAnsiEncoding >>\nendobj\n');
  });

  images.forEach(function(im){
    const num = imageNums[im.name];
    offsets[num]=pos;
    push(num+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+im.width+' /Height '+im.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+im.bytes.length+' >>\nstream\n');
    push(im.bytes);
    push('\nendstream\nendobj\n');
  });

  const csBytes = enc.encode(cs);
  offsets[contentNum]=pos; push(contentNum+' 0 obj\n<< /Length '+csBytes.length+' >>\nstream\n');
  push(csBytes);
  push('\nendstream\nendobj\n');

  const totalObjs = n-1;
  const xrefStart = pos;
  push('xref\n0 '+(totalObjs+1)+'\n0000000000 65535 f \n');
  for(let i=1;i<=totalObjs;i++){ push(String(offsets[i]).padStart(10,'0')+' 00000 n \n'); }
  push('trailer\n<< /Size '+(totalObjs+1)+' /Root '+catalogNum+' 0 R >>\nstartxref\n'+xrefStart+'\n%%EOF');

  let total = 0; chunks.forEach(function(c){ total += c.length; });
  const out = new Uint8Array(total); let o = 0;
  chunks.forEach(function(c){ out.set(c,o); o += c.length; });
  return out;
}
function triggerDownload(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
}
function showInvoiceResultModal(previewDataUrl, pdfBlob, j, c, biz){
  let html = '<h2>' + t('inv.title') + ' ' + j.invoiceNo + '</h2>';
  html += '<div class="sub" style="margin-bottom:10px;">' + t('inv.downloaded') + '</div>';
  html += '<div style="text-align:center;margin-bottom:12px;"><img src="' + previewDataUrl + '" style="max-width:100%;border:1px solid var(--line);border-radius:8px;"></div>';
  html += '<div class="footer-actions"><button class="btn btn-whatsapp btn-block" id="invShareBtn">' + ICON.whatsapp + ' ' + t('inv.sendWhatsapp') + '</button></div>';
  openModal(html);
  document.getElementById('invShareBtn').onclick = function(){ shareInvoicePDF(pdfBlob, j, c, biz); };
}
function shareInvoicePDF(pdfBlob, j, c, biz){
  const filename = j.invoiceNo + '.pdf';
  if(navigator.share && navigator.canShare){
    const file = new File([pdfBlob], filename, {type:'application/pdf'});
    if(navigator.canShare({files:[file]})){
      navigator.share({files:[file], title: t('inv.title')+' '+j.invoiceNo}).catch(function(){});
      return;
    }
  }
  const waPhone = c && c.phone ? c.phone.replace(/[^0-9]/g,'') : '';
  if(!waPhone){ alert(t('inv.noPhoneForShare')); return; }
  const serviceDescPlain = t('inv.serviceLine') + (c && c.brand ? ' — ' + c.brand + (c.model?' ('+c.model+')':'') : '');
  const waMsg = t('inv.title') + ' ' + j.invoiceNo + '\n' +
    (biz.name||'Nizam Service & Repair') + '\n\n' +
    t('inv.billTo') + ': ' + (c?c.name:'—') + '\n' +
    t('inv.date') + ': ' + fmtDate(j.date) + '\n' +
    t('inv.desc') + ': ' + serviceDescPlain + (j.notes?' - '+j.notes:'') + '\n' +
    t('inv.total') + ': ' + fmtMoney(j.amount) + '\n' +
    (biz.payment? t('inv.paymentInfo')+': '+biz.payment+'\n' : '') +
    t('inv.thankyou') + '\n\n' + t('inv.attachReminder');
  window.open('https://wa.me/'+waPhone+'?text='+encodeURIComponent(waMsg), '_blank');
}
async function generateInvoice(id){
  const j = DB.jobs.find(function(x){return x.id===id;});
  const c = DB.customers.find(function(x){return x.id===j.custId;});
  if(!j.invoiceNo){
    j.invoiceNo = 'INV-' + String(DB.invSeq).padStart(4,'0');
    DB.invSeq++;
    save();
    renderAll();
  }
  // Log this invoice once — covers both the normal "Generate invoice" button and the
  // quick-invoice flow (issueInvoiceForCustomer), since both end up here. Keyed by job id
  // so re-generating/re-downloading the same invoice later never creates a duplicate entry.
  if(!DB.invoices.some(function(x){return x.jobId===j.id;})){
    DB.invoices.push({
      id: nextId(), supabaseId: null, jobId: j.id, custId: j.custId,
      invoiceNo: j.invoiceNo, custName: c?c.name:'', amount: j.amount,
      issuedAt: new Date().toISOString(), _dirty: true
    });
    save();
    renderInvoiceRecords();
  }
  const biz = DB.settings.business || {};
  let assets;
  try{
    assets = await renderInvoicePNG(j, c, biz);
  }catch(err){
    alert(t('inv.genError'));
    return;
  }
  triggerDownload(assets.pdfBlob, j.invoiceNo+'.pdf');
  showInvoiceResultModal(assets.previewDataUrl, assets.pdfBlob, j, c, biz);
}
function statusBadge(status){
  const map = { new:[t('job.new'),'neutral'], assigned:[t('job.assigned'),'warn'], in_progress:[t('job.inProgress'),'active'], done:[t('job.done'),'ok'], cancelled:[t('job.cancelled'),'bad'] };
  const pair = map[status]||['—','neutral'];
  return '<span class="badge '+pair[1]+'">'+pair[0]+'</span>';
}
function jobSortRank(j){
  if(j.status==='done') return 2;
  if(j.appointmentAt && j.status!=='cancelled') return 0;
  return 1;
}
function renderJobs(){
  const chipEl = document.getElementById('jobFilterChip');
  if(jobFilter==='open'){
    chipEl.innerHTML = '<span class="filter-chip">'+t('filter.open')+' <button onclick="clearJobFilter()">'+t('filter.clear')+'</button></span>';
  } else if(jobFilter==='month'){
    chipEl.innerHTML = '<span class="filter-chip">'+t('filter.month')+' <button onclick="clearJobFilter()">'+t('filter.clear')+'</button></span>';
  } else {
    chipEl.innerHTML = '';
  }
  const q = (document.getElementById('jobSearch').value||'').toLowerCase();
  const thisMonth = todayISO().slice(0,7);
  const list = DB.jobs.slice().sort(function(a,b){
    const ra = jobSortRank(a), rb = jobSortRank(b);
    if(ra !== rb) return ra - rb;
    if(ra === 0) return a.appointmentAt.localeCompare(b.appointmentAt);
    return b.date.localeCompare(a.date);
  });
  const filtered = list.filter(function(j){
    if(jobFilter==='open' && !(j.status==='new'||j.status==='assigned'||j.status==='in_progress')) return false;
    if(jobFilter==='month' && !(j.status==='done' && j.date.slice(0,7)===thisMonth)) return false;
    if(!q) return true;
    const c = DB.customers.find(function(x){return x.id===j.custId;});
    const tc = DB.technicians.find(function(x){return x.id===j.techId;});
    return (c&&c.name.toLowerCase().includes(q)) || (tc&&tc.name.toLowerCase().includes(q));
  });
  const el = document.getElementById('jobsList');
  if(filtered.length===0){ el.innerHTML = emptyState(ICON.clipboard, t('job.emptyTitle'), t('job.emptySub')); return; }
  el.innerHTML = filtered.map(function(j){
    const c = DB.customers.find(function(x){return x.id===j.custId;});
    const tc = DB.technicians.find(function(x){return x.id===j.techId;});
    const comm = jobTechCommission(j);
    const showAppt = j.appointmentAt && j.status!=='done' && j.status!=='cancelled';
    return '<div class="card" onclick="openJobForm(\''+j.id+'\')">' +
      '<div class="row"><div>' +
        '<div class="name">'+(c?esc(c.name):t('job.deletedCustomer'))+'</div>' +
        '<div class="sub">'+(tc?esc(tc.name):t('job.unassigned'))+' · '+fmtDate(j.date)+'</div>' +
        (showAppt ? '<div class="sub"><span class="badge warn">'+t('job.apptBadge')+' '+fmtDateTime(j.appointmentAt)+'</span></div>' : '') +
        '<div class="sub">'+fmtMoney(j.amount)+t('job.charged')+fmtMoney(comm)+t('job.forTech')+fmtMoney(PLATFORM_FEE_PER_JOB)+t('job.platformFee')+fmtMoney(j.amount-comm-PLATFORM_FEE_PER_JOB)+t('job.forYou')+'</div>' +
        (j.invoiceNo ? '<div class="sub">'+j.invoiceNo+'</div>' : '') +
      '</div>'+statusBadge(j.status)+'</div></div>';
  }).join('');
}

/* ---------- DASHBOARD ---------- */
function renderDashboard(){
  const openJobs = DB.jobs.filter(function(j){ return j.status==='new'||j.status==='assigned'||j.status==='in_progress'; });
  document.getElementById('statPending').textContent = openJobs.length;

  const dueSoon = DB.customers.filter(function(c){
    const due = nextDueDate(c);
    if(!due) return false;
    const diff = daysBetween(todayISO(), due);
    return diff <= 7;
  });
  document.getElementById('statDue').textContent = dueSoon.length;

  const thisMonth = todayISO().slice(0,7);
  const doneThisMonth = DB.jobs.filter(function(j){ return j.status==='done' && j.date.slice(0,7)===thisMonth; });
  const kasar = doneThisMonth.reduce(function(s,j){ return s+j.amount; },0);
  const payouts = doneThisMonth.reduce(function(s,j){
    return s + jobTechCommission(j);
  },0);
  const platformFees = doneThisMonth.length * PLATFORM_FEE_PER_JOB;
  const bersih = kasar - payouts - platformFees;
  document.getElementById('statRevenue').textContent = fmtMoney(kasar);
  document.getElementById('statProfit').textContent = fmtMoney(bersih);

  const attn = document.getElementById('attentionList');
  const overdue = DB.customers.filter(function(c){ const d=nextDueDate(c); return d && daysBetween(todayISO(),d)<0; });
  const items = overdue.map(function(c){return {c:c};})
    .concat(dueSoon.filter(function(c){return overdue.indexOf(c)===-1;}).map(function(c){return {c:c};}))
    .slice(0,5);
  if(items.length===0){
    attn.innerHTML = '<div class="empty"><div class="big" style="background:var(--ok-tint);color:var(--ok);">'+ICON.check+'</div>'+t('dash.allClear')+'</div>';
  } else {
    attn.innerHTML = items.map(function(item){
      const c = item.c;
      const st = dueStatus(c);
      return '<div class="card" onclick="openCustomerForm(\''+c.id+'\')">' +
        '<div class="row"><div><div class="name">'+esc(c.name)+'</div><div class="sub">'+esc(c.area||'')+' · '+esc(c.brand||'')+'</div></div>' +
        '<span class="badge '+st.cls+'">'+st.label+'</span></div></div>';
    }).join('');
  }

  const recent = document.getElementById('recentJobs');
  const recentJ = DB.jobs.slice().sort(function(a,b){ return b.date.localeCompare(a.date); }).slice(0,4);
  if(recentJ.length===0){
    recent.innerHTML = emptyState(ICON.clipboard, t('job.emptyTitle'), t('job.emptySubDash'));
  } else {
    recent.innerHTML = recentJ.map(function(j){
      const c = DB.customers.find(function(x){return x.id===j.custId;});
      const tc = DB.technicians.find(function(x){return x.id===j.techId;});
      return '<div class="card" onclick="openJobForm(\''+j.id+'\')">' +
        '<div class="row"><div><div class="name">'+(c?esc(c.name):t('job.deletedCustomer'))+'</div><div class="sub">'+(tc?esc(tc.name):t('job.unassigned'))+' · '+fmtDate(j.date)+'</div></div>' +
        statusBadge(j.status)+'</div></div>';
    }).join('');
  }
}

/* ---------- FINANCIAL REPORT ---------- */
function renderInvoiceRecords(){
  const el = document.getElementById('invoiceRecordsList');
  if(!el) return;
  const sorted = DB.invoices.slice().sort(function(a,b){ return (b.issuedAt||'').localeCompare(a.issuedAt||''); });
  if(!sorted.length){ el.innerHTML = '<div class="sub">'+t('inv.recordsEmpty')+'</div>'; return; }
  el.innerHTML = sorted.map(function(r){
    return '<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line);">' +
      '<div>' +
        '<div class="name" style="font-size:14px;">'+esc(r.invoiceNo)+'</div>' +
        '<div class="sub">'+esc(r.custName||'—')+' · '+fmtMoney(r.amount)+'</div>' +
        '<div class="sub">'+esc(fmtDateTime(r.issuedAt))+'</div>' +
      '</div>' +
      '<button class="btn btn-danger btn-sm" onclick="deleteInvoiceRecord(\''+r.id+'\')">'+t('inv.recordsDelete')+'</button>' +
    '</div>';
  }).join('');
}
async function deleteInvoiceRecord(id){
  if(!confirm(t('inv.recordsConfirmDelete'))) return;
  const r = DB.invoices.find(function(x){return x.id===id;});
  DB.invoices = DB.invoices.filter(function(x){return x.id!==id;});
  save(); renderInvoiceRecords();
  // Best-effort remote delete, same pattern as deleteCustomer()/deleteJob() — this only
  // removes the log entry, never the underlying job or its own invoiceNo.
  if(r && r.supabaseId){
    try{ await sbCloud.rpc('delete_invoice_record', { p_id: r.supabaseId }); }catch(e){}
  }
}
function renderFinancialReport(){
  const input = document.getElementById('reportMonth');
  if(!input.value) input.value = todayISO().slice(0,7);
  const month = input.value;
  const jobsInMonth = DB.jobs.filter(function(j){ return j.status==='done' && j.date.slice(0,7)===month; });
  const revenue = jobsInMonth.reduce(function(s,j){ return s+j.amount; },0);
  const techPayouts = jobsInMonth.reduce(function(s,j){ return s+jobTechCommission(j); },0);
  const grossProfit = revenue - techPayouts;
  const systemFees = jobsInMonth.length * PLATFORM_FEE_PER_JOB;
  const netProfit = grossProfit - systemFees;
  document.getElementById('reportResults').innerHTML =
    '<div class="row"><span>'+t('report.jobsCompleted')+'</span><span>'+jobsInMonth.length+'</span></div>' +
    '<div class="row"><span>'+t('report.revenue')+'</span><span>'+fmtMoney(revenue)+'</span></div>' +
    '<div class="row"><span>'+t('report.techPayouts')+'</span><span>-'+fmtMoney(techPayouts)+'</span></div>' +
    '<div class="row"><span><b>'+t('report.grossProfit')+'</b></span><span><b>'+fmtMoney(grossProfit)+'</b></span></div>' +
    '<div class="row"><span>'+t('report.systemFees')+'</span><span>-'+fmtMoney(systemFees)+'</span></div>' +
    '<div class="row"><span><b>'+t('report.netProfit')+'</b></span><span><b>'+fmtMoney(netProfit)+'</b></span></div>';
}

function handleLogoUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  const MAX_BYTES = 300*1024;
  if(file.size > MAX_BYTES){ alert(t('settings.imgTooLarge').replace('{max}','300KB')); e.target.value=''; return; }
  const reader = new FileReader();
  reader.onload = function(ev){
    DB.settings.business.logo = ev.target.result;
    save();
    renderLogoPreview();
  };
  reader.readAsDataURL(file);
}

}

function importData(){
  const f = document.getElementById('importFile').files[0];
  if(!f){ alert(t('settings.chooseFile')); return; }
  if(!confirm(t('settings.confirmRestore'))) return;
  const reader = new FileReader();
  reader.onload = function(e){

/* ---------- PIN LOCK ---------- */
const INACTIVITY_MS = 5*60*1000;
let pinBuffer = '';
let lastActivity = Date.now();
let appLocked = true;

function updatePinDots(errorState){
  const dots = document.querySelectorAll('#lockDots .lock-dot');
  dots.forEach(function(d, i){
    d.classList.toggle('filled', i < pinBuffer.length);
    d.classList.toggle('error', !!errorState);
  });
}
function pressPinDigit(d){
  if(pinBuffer.length>=4) return;
  pinBuffer += d;
  updatePinDots(false);
  if(pinBuffer.length===4){ setTimeout(checkPin, 120); }
}
function backspacePin(){
  pinBuffer = pinBuffer.slice(0,-1);
  updatePinDots(false);
}
function checkPin(){
  if(pinBuffer === (DB.settings.pin||'0000')){
    unlockApp();
  } else {
    const dotsEl = document.getElementById('lockDots');
    updatePinDots(true);
    dotsEl.classList.add('shake');
    setTimeout(function(){
      dotsEl.classList.remove('shake');
      pinBuffer = '';
      updatePinDots(false);
    }, 400);
  }
}
function unlockApp(){
  appLocked = false;
  pinBuffer = '';
  lastActivity = Date.now();
  document.getElementById('lockOverlay').classList.add('hidden');
}
function lockApp(){
  appLocked = true;
  pinBuffer = '';
  updatePinDots(false);
  document.getElementById('lockOverlay').classList.remove('hidden');
}
function markActivity(){ lastActivity = Date.now(); }
document.addEventListener('touchstart', markActivity, {passive:true});
document.addEventListener('mousedown', markActivity);
document.addEventListener('keydown', markActivity);
setInterval(function(){
  if(!appLocked && (Date.now()-lastActivity) > INACTIVITY_MS){ lockApp(); }
}, 10000);
function changePin(){
  const cur = document.getElementById('pinCurrent').value.trim();
  const nw = document.getElementById('pinNew').value.trim();
  const cf = document.getElementById('pinConfirm').value.trim();
  if(cur !== (DB.settings.pin||'0000')){ alert(t('settings.pinWrong')); return; }
  if(!/^\d{4}$/.test(nw)){ alert(t('settings.pinInvalid')); return; }
  if(nw !== cf){ alert(t('settings.pinMismatch')); return; }
  DB.settings.pin = nw;
  save();
  document.getElementById('pinCurrent').value = '';
  document.getElementById('pinNew').value = '';
  document.getElementById('pinConfirm').value = '';
  alert(t('settings.pinSaved'));
}
const headerLogoImg = document.querySelector('.drop-badge img');
if(headerLogoImg){ document.getElementById('lockLogoImg').src = headerLogoImg.src; }

applyStaticI18n();
renderAll();
